<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltioVerde | Contacto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="header-principal sticky-top bg-white border-bottom">
    <nav class="navbar navbar-expand-lg container">
      <a class="navbar-brand fw-bold text-success" href="index.html">⚡ VoltioVerde</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5 max-w-600">
    <h1 class="h2 fw-bold text-center mb-4">Asesoría en Eficiencia Energética</h1>
    <form class="card p-4 shadow-sm border-0 bg-light">
      <div class="mb-3">
        <label for="nombreCompleto" class="form-label fw-semibold">1. Nombre Completo</label>
        <input type="text" class="form-control" id="nombreCompleto" required placeholder="Ej. Juan Esteban Franco">
      </div>
      <div class="mb-3">
        <label for="correoElectrónico" class="form-label fw-semibold">2. Correo Electrónico</label>
        <input type="email" class="form-control" id="correoElectrónico" required placeholder="ejemplo@iudigital.edu.co">
      </div>
      <div class="mb-3">
        <label for="telefonoContacto" class="form-label fw-semibold">3. Teléfono de Contacto</label>
        <input type="tel" class="form-control" id="telefonoContacto" required placeholder="300 000 0000">
      </div>
      <div class="mb-3">
        <label for="tipoSolicitud" class="form-label fw-semibold">4. Motivo de Consulta</label>
        <select class="form-select" id="tipoSolicitud" required>
          <option value="">Seleccione una opción</option>
          <option value="asesoria">Asesoría de reemplazo Inverter</option>
          <option value="cotizacion">Cotización mayorista</option>
          <option value="soporte">Soporte posventa</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="mensajeUsuario" class="form-label fw-semibold">5. Detalles del Proyecto o Consulta</label>
        <textarea class="form-control" id="mensajeUsuario" rows="4" required placeholder="Indique los equipos que desea reemplazar en su hogar o empresa..."></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold">Enviar Consulta</button>
    </form>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
      <p class="mb-0">© 2026 VoltioVerde Store - Juan Esteban Franco Monsalve | Ingeniería Web I</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
