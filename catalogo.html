<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltioVerde | Catálogo de Equipos Eficientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="header-principal sticky-top bg-white border-bottom">
    <nav class="navbar navbar-expand-lg container">
      <a class="navbar-brand fw-bold text-success" href="index.html">⚡ VoltioVerde</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <h1 class="h2 fw-bold mb-4">Catálogo de Equipos Eficientes</h1>

    <div class="row mb-4 g-3 align-items-center">
      <div class="col-md-6">
        <input type="text" id="campo-buscador" class="form-control" placeholder="Buscar por nombre de equipo...">
      </div>
      <div class="col-md-6">
        <div id="contenedor-filtros" class="d-flex flex-wrap gap-2">
          <button class="btn btn-outline-success active" data-categoria="Todas">Todas</button>
          <button class="btn btn-outline-success" data-categoria="Refrigeracion">Refrigeración</button>
          <button class="btn btn-outline-success" data-categoria="Climatizacion">Climatización</button>
          <button class="btn btn-outline-success" data-categoria="Iluminacion">Iluminación</button>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <section class="col-lg-8">
        <div id="grid-productos" class="row row-cols-1 row-cols-md-2 g-4">
          <!-- Tarjetas renderizadas dinámicamente con JavaScript -->
        </div>
      </section>

      <aside class="col-lg-4">
        <div class="card p-3 shadow-sm border-0 bg-light sticky-top" style="top: 90px;">
          <h2 class="h4 fw-bold mb-3 text-dark">🛒 Carrito de Compras</h2>
          <div id="lista-carrito" class="list-group mb-3">
            <p class="text-muted small">El carrito está vacío.</p>
          </div>
          <div class="border-top pt-3">
            <p class="d-flex justify-content-between mb-1">
              <span>Total Inversión:</span>
              <strong id="carrito-total">$ 0</strong>
            </p>
            <p class="d-flex justify-content-between mb-1 text-success">
              <span>Ahorro Estimado / Mes:</span>
              <strong id="carrito-ahorro">$ 0</strong>
            </p>
            <p class="d-flex justify-content-between mb-3 text-primary">
              <span>Retorno de Inversión:</span>
              <strong id="carrito-payback">0 meses</strong>
            </p>
            <button id="btn-vaciar" class="btn btn-outline-danger w-100">Vaciar Carrito</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
      <p class="mb-0">© 2026 VoltioVerde Store - Juan Esteban Franco Monsalve | Ingeniería Web I</p>
    </div>
  </footer>

  <script src="js/tienda.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
